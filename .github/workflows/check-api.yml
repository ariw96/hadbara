name: בדיקת המאגר הממשלתי
on:
  schedule:
    - cron: '17 5 * * 0'   # כל יום ראשון, 07:17/08:17 שעון ישראל
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-api.mjs
