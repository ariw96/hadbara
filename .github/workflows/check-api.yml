name: בדיקת המאגר הממשלתי
on:
  schedule:
    - cron: '17 5 * * 0'   # כל יום ראשון, 07:17/08:17 שעון ישראל
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: chk
        run: node scripts/check-api.mjs
      # פותח Issue (ומכאן מייל אליך) כשיש בעיה או כשהמאגר עודכן
      - if: always() && steps.chk.outputs.issue_title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.chk.outputs.issue_title }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue.md
